name: Build AsusFanControl

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-15 (arm64) is much more available than the scarce Intel images.
    # The kext is cross-built for x86_64; MacKernelSDK's headers abort under
    # arm64, so ARCHS must be pinned.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      # The SDKs come from the source repositories, not the release CDN.
      # Upstream bootstrap scripts pull zip archives from GitHub releases, and
      # that CDN resets the connection often enough to fail builds before any
      # code is compiled. Everything needed is in the repositories.
      - name: Fetch SDK headers
        run: |
          set -euo pipefail
          LILU=Lilu.kext/Contents/Resources
          VSMCFG=VirtualSMC.kext/Contents/Resources
          mkdir -p "$LILU/Headers" "$LILU/Library" "$VSMCFG/VirtualSMCSDK"

          put() {
            curl -Lfs --retry 5 --retry-delay 3 --retry-all-errors "$1" -o "$2" \
              || { echo "FAILED: $1"; return 1; }
          }

          for h in kern_api.hpp kern_compat.hpp kern_config.hpp kern_compression.hpp \
                   kern_cpu.hpp kern_crypto.hpp kern_devinfo.hpp kern_disasm.hpp \
                   kern_efi.hpp kern_file.hpp kern_iokit.hpp kern_mach.hpp \
                   kern_nvram.hpp kern_patcher.hpp kern_policy.hpp kern_rtc.hpp \
                   kern_time.hpp kern_user.hpp kern_util.hpp kern_version.hpp \
                   plugin_start.hpp hde32.h hde64.h; do
            put "https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Headers/$h" \
                "$LILU/Headers/$h"
          done

          put "https://raw.githubusercontent.com/acidanthera/Lilu/master/Lilu/Library/plugin_start.cpp" \
              "$LILU/Library/plugin_start.cpp"

          for h in AppleSmc.h AppleSmcBridge.hpp kern_keyvalue.hpp kern_smcinfo.hpp \
                   kern_value.hpp kern_vsmcapi.hpp; do
            put "https://raw.githubusercontent.com/acidanthera/VirtualSMC/master/VirtualSMCSDK/$h" \
                "$VSMCFG/VirtualSMCSDK/$h"
          done

          ls "$VSMCFG/VirtualSMCSDK"

      - name: Fetch MacKernelSDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/acidanthera/MacKernelSDK
          test -f MacKernelSDK/Library/x86_64/libkmod.a

      - name: Build (Debug)
        run: |
          set -euo pipefail
          xcodebuild -jobs 1 -configuration Debug \
            -project AsusFanControl.xcodeproj -target AsusFanControl \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee debug.log

      - name: Build (Release)
        run: |
          set -euo pipefail
          xcodebuild -jobs 1 -configuration Release \
            -project AsusFanControl.xcodeproj -target AsusFanControl \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee release.log

      - name: Verify kext
        run: |
          set -euo pipefail

          KEXT=$(find build -name "AsusFanControl.kext" -maxdepth 4 | head -n 1)
          test -n "$KEXT" || { echo "AsusFanControl.kext not produced"; exit 1; }
          echo "kext: $KEXT"
          plutil -p "$KEXT/Contents/Info.plist"

          BIN="$KEXT/Contents/MacOS/AsusFanControl"
          lipo -info "$BIN" | grep -q x86_64 || { echo "not x86_64"; exit 1; }
          if lipo -info "$BIN" | grep -q arm64; then
            echo "unexpectedly contains arm64"; exit 1
          fi

          # A kernel extension must carry kmod_info. Without it the kernel refuses
          # to load the kext, and the failure is silent: the kext installs, appears
          # in the bundle list, and never shows up in kmutil showloaded.
          nm -a "$BIN" 2>/dev/null | grep -q 'kmod_info' \
            || { echo "MISSING kmod_info - the kext would not load"; exit 1; }
          echo "kmod_info present"

          # SMC_MAKE_IDENTIFIER('F','0','A','c') is a UINT32 whose little-endian
          # bytes are "F0Ac", so grep -a on the raw file is the reliable check.
          for key in FNum F0Ac F1Ac F0Mn F0Mx F0Md F1Md F0Tp; do
            grep -aq "$key" "$BIN" || { echo "MISSING fan key $key"; exit 1; }
          done
          echo "all fan key bytes present"

          for m in setFanMode setThermalProfile getFanSpeed refreshAll; do
            grep -aq "$m" "$BIN" || { echo "MISSING symbol $m"; exit 1; }
          done
          echo "verification OK"

      - name: Package
        if: always()
        run: |
          set -euo pipefail
          OUT="$PWD/artifacts"
          mkdir -p "$OUT"
          for cfg in Debug Release; do
            [ -d "build/$cfg/AsusFanControl.kext" ] && \
              ditto "build/$cfg/AsusFanControl.kext" "$OUT/AsusFanControl-$cfg.kext" || true
          done
          ls -l "$OUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsusFanControl
          path: artifacts/*
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            *.log
          if-no-files-found: ignore
